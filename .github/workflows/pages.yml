# Publishes main at the site root and the test branch (when it exists) under /test/,
# so builds can be tried on hardware before they reach main.
name: Pages

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          if git rev-parse -q --verify origin/test >/dev/null; then
            mkdir _site/test
            git archive origin/test | tar -x -C _site/test
            # Tell test builds apart without bumping the release version: <version>+test.<commit>.
            stamp="+test.$(git rev-parse --short origin/test)"
            sed -i -E "s/(UVSTUDIO_VERSION = \"[^\"]+)\"/\1$stamp\"/" _site/test/js/studio-version.js
            sed -i -E "s/(studio-version\.js\?v=[^\"]+)\"/\1$stamp\"/" _site/test/index.html
          fi
          rm -rf _site/.github _site/test/.github
          # Offline copy: give each site's sw.js its file list and build, so a deploy refreshes it.
          for dir in _site _site/test; do
            [ -f "$dir/sw.js" ] || continue
            files=$(cd "$dir" && find . -type f ! -path './test/*' ! -path './tests/*' ! -path './tools/*' \
              ! -path './assets/factory/*' ! -name sw.js | sed 's|^\./||' | sort | jq -R . | jq -sc .)
            build=$(git rev-parse --short "$([ "$dir" = _site ] && echo HEAD || echo origin/test)")
            sed -i -e "s|^const FILES = \[\];|const FILES = $files;|" -e "s|^const BUILD = '';|const BUILD = '$build';|" "$dir/sw.js"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
